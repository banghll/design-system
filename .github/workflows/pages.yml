# master 에 밀면 공개 사이트가 갱신된다.
#
# 왜 gh-pages 브랜치로 미는가 — actions/deploy-pages 는 Pages 사이트를 API 로
# 만들어야 하는데 기본 GITHUB_TOKEN 에는 그 권한이 없다
# ("Resource not accessible by integration" 으로 세 번 죽었다).
# 반면 gh-pages 라는 이름의 브랜치는 GitHub 이 알아서 Pages 로 붙여 준다.
# 그래서 빌드 결과를 그 브랜치에 그대로 밀어 넣는다.
#
# 주소: https://<계정>.github.io/<레포이름>/
name: Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 하위 경로(/<레포이름>)에 올라가므로 basePath 를 넘긴다.
      # 빼면 CSS 와 썸네일이 통째로 404 난다.
      - run: npm run share
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: gh-pages 로 밀기
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "site: ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
